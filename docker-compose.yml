services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hrm-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    networks:
      - hrm-network

networks:
  hrm-network:
    driver: bridge